<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hormone signalling explorer</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#19304b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:12px 18px}h1{font-size:1.4rem;margin:0 0 3px}p{line-height:1.48}.sub{color:#52647b;margin:0 0 9px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}button{font:inherit;cursor:pointer;border:1px solid #c6d3e2;background:#fff;color:#183c5c;border-radius:9px;padding:7px 12px}button:hover{background:#eef5ff}button.active,.primary{background:#1767a7;color:white;border-color:#1767a7}.panel{background:white;border:1px solid #d8e2ed;border-radius:13px;padding:12px;box-shadow:0 3px 12px #16334d0a}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.top h2{font-size:1.16rem;margin:0}.stage{background:#f7fbff;border:1px solid #e2ebf4;border-radius:10px;margin-top:8px;overflow:hidden}.stage svg{display:block;width:100%;height:auto;max-height:350px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}.status{border-left:4px solid #1767a7;background:#f1f7fd;padding:8px 10px;border-radius:5px;margin-top:8px;min-height:54px}.status strong{display:block;margin-bottom:3px}.progress{font-size:.85rem;color:#61758b}.hint{color:#5d6f83;font-size:.9rem;margin:6px 0 0}.muted{opacity:.2}.highlight{filter:drop-shadow(0 0 5px #f5ad39)}.question{margin-top:14px;padding:13px;border:1px solid #d8e2ed;border-radius:10px}.answers{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.feedback{margin-top:8px;font-weight:600}.correct{color:#16714c}.incorrect{color:#a3412d}.legend{font-size:12px;fill:#435a71}.label{font-size:14px;fill:#213f59;font-weight:600}.small{font-size:11px;fill:#496078}.component{transition:opacity .3s,filter .3s}.choices{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}.examples{margin-top:8px;font-size:.87rem;color:#3b536b;line-height:1.4}.examples strong{color:#19304b}label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.94rem}input{accent-color:#1767a7}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.compare>div{border:1px solid #d8e2ed;border-radius:9px;padding:12px;background:#f8fbff}.compare h3{margin:0 0 5px;font-size:1rem}.compare p{margin:0;font-size:.92rem}.responses{margin-top:13px;padding:12px 15px;background:#f8fbff;border:1px solid #d8e2ed;border-radius:10px}.responses h3{font-size:1rem;margin:0 0 6px}.responses p{margin:5px 0}.responses ul{margin:7px 0;padding-left:22px}.responses li{margin:4px 0}.quiz-item{padding:12px 0;border-bottom:1px solid #e0e7ef}.quiz-item:last-child{border:0}.quiz-item p{font-weight:600;margin:0 0 9px}.quiz-item button{margin:0 6px 6px 0;text-align:left}.quiz-item button.selected{border-color:#1767a7;background:#e4f1fb}.quiz-result{font-weight:700;margin-top:10px}@media(max-width:650px){.wrap{padding:10px}.panel{padding:11px}.compare{grid-template-columns:1fr}.label{font-size:13px}}
</style></head><body><main class="wrap"><h1>Hormone signalling: from secretion to cellular response</h1><p class="sub">Explore what stimulates hormone secretion, then follow how hormones act on target cells.</p><nav class="tabs" aria-label="Explorer sections"><button class="active" data-tab="secretion">Regulation of secretion</button><button data-tab="amino">Amino-acid hormones</button><button data-tab="steroid">Steroid hormones</button><button data-tab="compare">Compare pathways</button><button data-tab="quiz">Check understanding</button></nav><section class="panel" id="content" aria-live="polite"></section></main><script>
const pathways={amino:[['Hormone arrives','An amino-acid hormone reaches a target cell through the bloodstream. It cannot diffuse through the lipid bilayer.'],['Surface receptor binding','The hormone binds to its specific receptor on the plasma membrane. Only cells with the appropriate receptor can respond.'],['G protein activation','The activated receptor stimulates a G protein on the inner surface of the membrane.'],['Adenylyl cyclase activation','The G protein activates adenylyl cyclase, an enzyme associated with the membrane.'],['Second messenger production','Adenylyl cyclase converts ATP into cyclic AMP (cAMP), an intracellular second messenger.'],['Protein kinase activation','cAMP activates protein kinase A, which phosphorylates selected proteins.'],['Cellular response','Changes in protein activity produce the hormone-directed response in the target cell.']],steroid:[['Hormone arrives','A steroid hormone reaches a target cell through the bloodstream.'],['Membrane diffusion','Because it is lipid soluble, the steroid hormone diffuses through the plasma membrane.'],['Intracellular receptor binding','The hormone binds to its specific receptor inside the cell, forming a hormone–receptor complex.'],['Nuclear entry','The activated hormone–receptor complex enters the nucleus.'],['Gene transcription','The complex interacts with DNA to regulate transcription, producing messenger RNA (mRNA).'],['Protein synthesis','The mRNA is translated by ribosomes to produce a protein.'],['Cellular response','The newly synthesised protein contributes to the hormone-directed response.']]};
let tab='secretion',step=0,blocked=false,playing=false,timer=null,quizAnswers={};const root=document.getElementById('content');
function stop(){playing=false;clearInterval(timer);timer=null}function button(label,fn,cls=''){return `<button class="${cls}" data-act="${fn}">${label}</button>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',b.dataset.tab===tab)});if(tab==='secretion'){renderSecretion();return}if(tab==='compare'){renderCompare();return}if(tab==='quiz'){renderQuiz();return}let a=tab==='amino',steps=pathways[tab],failure=blocked&&(a?step>=1:step>=2);root.innerHTML=`<div class="top"><h2>${a?'Amino-acid hormone: membrane receptor and cAMP':'Steroid hormone: intracellular receptor and gene expression'}</h2><span class="progress">Step ${step+1} of ${steps.length}</span></div><div class="stage">${diagram(a,step,blocked)}</div><div class="controls">${button('◀ Previous','prev')}${button(playing?'Pause':'▶ Play', 'play','primary')}${button('Next ▶','next')}${button('Reset','reset')}</div><div class="status"><strong>${steps[step][0]}</strong>${failure?`<span class="incorrect">Pathway interrupted:</span> ${a?'Without a functional surface receptor, the hormone cannot activate the intracellular signalling cascade.':'Without a functional intracellular receptor, the hormone cannot form the complex required to regulate transcription.'}`:steps[step][1]}</div><div class="examples"><strong>${a?'Examples of amino-acid-derived hormones':'Examples of steroid hormones'}:</strong> ${a?'Insulin, glucagon, growth hormone, prolactin, antidiuretic hormone, oxytocin, adrenaline, noradrenaline, melatonin, triiodothyronine and thyroxine.':'Cortisol, aldosterone, oestrogen, progesterone and testosterone.'}${a?' <em>Note: thyroid hormones (triiodothyronine and thyroxine) are amino-acid-derived but act mainly through intracellular receptors, unlike the cAMP pathway illustrated.</em>':''}</div>`}

const secretionModes={
 humoral:{title:'Humoral stimulation',subtitle:'A change in blood composition directly stimulates endocrine cells.',nodes:[['Blood glucose rises','Stimulus in blood'],['Pancreatic β-cells','Endocrine cells detect change'],['Insulin released','Hormone enters blood']],descriptions:['After a carbohydrate-containing meal, blood glucose concentration increases.','Pancreatic β-cells respond directly to the rise in blood glucose.','β-cells secrete insulin into the bloodstream. Insulin can then travel to target tissues.'],note:'The stimulus is a change in the concentration of a substance in the blood.'},
 hormonal:{title:'Hormonal stimulation',subtitle:'A hormone from one endocrine gland stimulates another endocrine gland.',nodes:[['Anterior pituitary','Releases thyroid-stimulating hormone'],['Thyroid gland','Responds to thyroid-stimulating hormone'],['Triiodothyronine and thyroxine released','Hormones enter blood']],descriptions:['The anterior pituitary releases thyroid-stimulating hormone into the blood.','Thyroid-stimulating hormone reaches the thyroid gland and binds to receptors on thyroid cells.','The thyroid gland secretes triiodothyronine and thyroxine into the bloodstream.'],note:'The stimulus is a hormone released by another endocrine gland.'},
 neural:{title:'Neural stimulation',subtitle:'Nerve impulses stimulate hormone secretion.',nodes:[['Sympathetic nerve','Nerve impulse'],['Adrenal medulla','Receives neural stimulus'],['Adrenaline + noradrenaline','Hormones enter blood']],descriptions:['Sympathetic nerve impulses travel towards the adrenal medulla.','Preganglionic sympathetic neurons stimulate chromaffin cells of the adrenal medulla.','The adrenal medulla releases adrenaline and noradrenaline into the bloodstream.'],note:'The stimulus is neural activity, rather than a change in blood composition or another circulating hormone.'}
};
let secretionMode='humoral',secretionStep=0,secretionPlaying=false,secretionTimer=null;
function stopSecretion(){secretionPlaying=false;clearInterval(secretionTimer);secretionTimer=null}
function secretionIcon(kind,x,y){
 const common=`transform="translate(${x} ${y})" stroke-linecap="round" stroke-linejoin="round"`;
 const icons={
 meal:`<g ${common}><ellipse cx="52" cy="70" rx="45" ry="10" fill="#d6e8f3"/><path d="M16 34Q52 70 88 34" fill="#fff" stroke="#5a8aab" stroke-width="3"/><path d="M21 34Q52 53 83 34" fill="#f8d88b" stroke="#dba43e" stroke-width="2"/><path d="M36 20q8-14 18 0q10-14 19 1" fill="none" stroke="#db8a38" stroke-width="7"/><path d="M4 9v39m-5-30h10M99 9v39" stroke="#728aa2" stroke-width="3"/></g>`,
 pancreas:`<g ${common}><path d="M10 46C16 18 36 25 48 16S72 24 85 19Q103 18 98 42C94 55 79 54 66 48S42 64 26 54Q10 58 10 46Z" fill="#f6b97c" stroke="#ba754c" stroke-width="3"/><path d="M29 39Q49 26 70 37" fill="none" stroke="#d28c59" stroke-width="3"/><circle cx="46" cy="42" r="6" fill="#fff1c9"/><circle cx="63" cy="35" r="5" fill="#fff1c9"/></g>`,
 pituitary:`<g ${common}><path d="M53 6C19 5 10 30 22 48Q33 63 46 47L49 58Q53 64 58 58L61 47Q75 62 87 48C103 28 85 5 53 6Z" fill="#e5d5f2" stroke="#9376ac" stroke-width="3"/><path d="M35 29Q53 15 71 29" stroke="#a48aba" fill="none" stroke-width="3"/><path d="M47 48Q54 55 61 48" stroke="#a48aba" fill="none" stroke-width="2"/><text x="53" y="83" text-anchor="middle" font-size="11" fill="#526d87">Anterior lobe</text></g>`,
 thyroid:`<g ${common}><path d="M47 15v49" stroke="#aac6d7" stroke-width="11"/><path d="M47 31C21 1 5 19 12 46C17 65 32 58 47 48C62 58 77 65 82 46C89 19 73 1 47 31Z" fill="#f3a8b1" stroke="#b96778" stroke-width="3"/><path d="M47 31v17" stroke="#b96778" stroke-width="3"/></g>`,
 nerve:`<g ${common}><path d="M9 33H50" stroke="#d8a248" stroke-width="9"/><path d="M48 33L68 16M48 33L70 35M48 33L68 53" stroke="#d8a248" stroke-width="5"/><path d="M70 16l14-6M70 35l16 0M68 53l14 8" stroke="#d8a248" stroke-width="3"/><path d="M10 33h31" stroke="#fff5cf" stroke-width="2" stroke-dasharray="5 5"/><circle cx="87" cy="35" r="4" fill="#347cac"/></g>`,
 adrenal:`<g ${common}><path d="M19 62Q51 42 85 62L85 70Q51 54 19 70Z" fill="#a9c5dc" stroke="#668cac" stroke-width="2"/><path d="M21 44Q19 19 49 16Q77 13 86 44Q72 58 54 49Q38 59 21 44Z" fill="#f6c28e" stroke="#bc8354" stroke-width="3"/><path d="M30 42Q50 24 76 42" stroke="#dd9e65" stroke-width="2" fill="none"/><ellipse cx="53" cy="40" rx="16" ry="10" fill="#e7a2a9" stroke="#b36d79" stroke-width="2"/></g>`,
 targets:`<g ${common}><path d="M12 20Q30 6 44 20L44 54Q30 68 12 54Z" fill="#d8e9fa" stroke="#6397b8" stroke-width="2"/><path d="M54 20Q72 6 90 20L90 54Q72 68 54 54Z" fill="#d8e9fa" stroke="#6397b8" stroke-width="2"/><circle cx="29" cy="37" r="7" fill="#8fc6a8"/><circle cx="72" cy="37" r="7" fill="#8fc6a8"/><path d="M29 30v14m-7-7h14M72 30v14m-7-7h14" stroke="#fff" stroke-width="2"/></g>`
 };return icons[kind]||'';
}
function secretionDiagram(){
 const d=secretionModes[secretionMode], mode=secretionMode;
 const config={
 humoral:{icons:['meal','pancreas','targets'],labels:[['Meal','Blood glucose rises'],['Pancreas','β-cells release insulin'],['Target organs','Insulin arrives']],hormone:'Insulin',stimulus:'Glucose ↑'},
 hormonal:{icons:['pituitary','thyroid','targets'],labels:[['Anterior pituitary','Thyroid-stimulating hormone released'],['Thyroid gland','Thyroid-stimulating hormone binds'],['Target organs','Triiodothyronine and thyroxine arrive']],hormone:'Triiodothyronine and thyroxine',stimulus:'Thyroid-stimulating hormone'},
 neural:{icons:['nerve','adrenal','targets'],labels:[['Sympathetic nerve','Nerve impulse'],['Adrenal medulla','Adrenaline and noradrenaline released'],['Target organs','Adrenaline and noradrenaline arrive']],hormone:'Adrenaline and noradrenaline',stimulus:'Nerve signal'}
 }[mode];
 const xs=[42,353,664];
 const stimulusLabels={
  humoral:{text:'Stimulus: change in blood composition',color:'#a64a4d',fill:'#fbe8e9',symbol:'●'},
  hormonal:{text:'Stimulus: hormone from another endocrine gland',color:'#6551a3',fill:'#eeeafa',symbol:'◆'},
  neural:{text:'Stimulus: nerve impulse',color:'#a26612',fill:'#fff0d6',symbol:'ϟ'}
 };
 const stim=stimulusLabels[mode];
 let svg=`<svg viewBox="0 0 960 300" role="img" aria-label="One example of ${d.title.toLowerCase()}: ${config.labels.map(x=>x.join(', ')).join('; ')}"><defs><marker id="secarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6488a7"/></marker></defs><rect width="960" height="300" fill="#f4faff"/><rect x="18" y="4" width="${mode==='hormonal'?472:mode==='humoral'?374:277}" height="30" rx="9" fill="${stim.fill}"/><text x="31" y="24" fill="${stim.color}" font-size="16" font-weight="700">${stim.symbol}</text><text x="54" y="24" fill="${stim.color}" font-size="15" font-weight="700">${stim.text}</text>`;
 // Bloodstream is continuous and distinct from the illustrated glands and target tissues.
 svg+=`<rect x="18" y="232" width="924" height="43" rx="21" fill="#f9dfe0" stroke="#d78990" stroke-width="1.5"/><path d="M45 253H916" stroke="#cb8189" stroke-width="2" stroke-dasharray="7 9"/><text x="33" y="292" font-size="12" fill="#426b89">Bloodstream: hormones circulate to target organs</text>`;
 for(let i=0;i<3;i++){
  const active=secretionStep>=i;
  svg+=`<g opacity="${active?1:.26}"><rect x="${xs[i]}" y="39" width="254" height="166" rx="14" fill="${i===0?'#fff6e8':i===1?'#e9f4ff':'#e9f8f0'}" stroke="${i===0?stim.color:secretionStep===i?'#d58e22':'#b5cde0'}" stroke-width="${secretionStep===i?3:1.5}"/>${secretionIcon(config.icons[i],xs[i]+74,50)}<text x="${xs[i]+127}" y="151" font-size="17" font-weight="700" text-anchor="middle" fill="#193e5c">${config.labels[i][0]}</text><text x="${xs[i]+127}" y="176" font-size="${config.labels[i][1].length>29?11:13}" text-anchor="middle" fill="#41627d">${config.labels[i][1].length>34?config.labels[i][1].replace(' hormone ', ' hormone|').replace(' and ', ' and|').split('|').map((line,j)=>`<tspan x="${xs[i]+127}" dy="${j===0?0:14}">${line}</tspan>`).join(''):config.labels[i][1]}</text></g>`;
 }
 // Directional links and their specific hormone labels.
 svg+=`<path d="M296 120H346" stroke="#6488a7" stroke-width="3" marker-end="url(#secarrow)"/>`;
 // Hormones enter the bloodstream and are transported to their target organs.
 const particles=secretionStep>=1?1:.22;
 svg+=`<g opacity="${particles}"><path d="M480 205V233" stroke="#357da8" stroke-width="3" marker-end="url(#secarrow)"/><circle cx="504" cy="251" r="5" fill="#e7a447"/><circle cx="535" cy="251" r="5" fill="#e7a447"/><circle cx="568" cy="251" r="5" fill="#e7a447"/><circle cx="600" cy="251" r="5" fill="#e7a447"/><circle cx="633" cy="251" r="5" fill="#e7a447"/><circle cx="666" cy="251" r="5" fill="#e7a447"/><circle cx="699" cy="251" r="5" fill="#e7a447"/><circle cx="732" cy="251" r="5" fill="#e7a447"/></g><g opacity="${secretionStep>=2?1:.16}"><path d="M791 251V208" stroke="#6488a7" stroke-width="3" marker-end="url(#secarrow)"/></g>`;
 svg+=`</svg>`;return svg;
}
function renderSecretion(){const d=secretionModes[secretionMode];root.innerHTML=`<div class="top"><h2>Regulation of hormone secretion</h2><span class="progress">Step ${secretionStep+1} of 3</span></div><p class="sub" style="margin:6px 0 8px">Each animation illustrates <strong>one example</strong> of a secretion mechanism, not the only hormone regulated in this way.</p><div class="controls" style="margin:0 0 8px">${Object.entries(secretionModes).map(([k,v])=>`<button data-mode="${k}" class="${k===secretionMode?'active':''}" aria-pressed="${k===secretionMode}">${v.title}</button>`).join('')}</div><div class="stage">${secretionDiagram()}</div><div class="controls">${button('◀ Previous','sec-prev')}${button(secretionPlaying?'Pause':'▶ Play','sec-play','primary')}${button('Next ▶','sec-next')}${button('Reset','sec-reset')}</div>`}

function diagram(a,s,b){
const labels=a?['Amino-acid\nhormone','Surface\nreceptor','G protein','Adenylyl\ncyclase','cAMP','Protein\nkinase','Cellular\nresponse']:['Steroid\nhormone','Membrane\ndiffusion','Intracellular\nreceptor','Hormone–receptor\ncomplex','Gene\ntranscription','Protein\nsynthesis','Cellular\nresponse'];
// Compact stage: pathway above, two-column outcomes below, all within the cytoplasm.
const pts=[[36,28],[178,65],[178,150],[324,150],[470,150],[616,150],[762,150]];
const arrow=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="#738ba4" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>`;
let out=`<svg viewBox="0 0 940 350" role="img" aria-label="${a?'Amino-acid hormone signalling cascade':'Steroid hormone signalling cascade'}; the cellular response occurs within the target cell"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#738ba4"/></marker></defs><rect width="940" height="350" fill="#eaf5fd"/><rect width="940" height="113" fill="#f7fbff"/><rect y="113" width="940" height="13" fill="#f5d7a8"/><path d="M0 113H940 M0 126H940" stroke="#c89e61" stroke-width="2"/><text x="16" y="17" class="legend">Extracellular space</text><text x="16" y="340" class="legend">Target-cell cytoplasm (intracellular space)</text><text x="738" y="105" class="legend">Plasma membrane</text>`;
out+=arrow(158,72,174,100);out+=arrow(240,135,240,148);
for(let i=2;i<6;i++)out+=arrow(pts[i][0]+125,185,pts[i+1][0]-5,185);
pts.forEach(([x,y],i)=>{
 const active=s>=i&&!(b&&i>=(a?1:2));
 const dim=active?1:.27,current=active&&s===i;
 const fill=i===0?'#fff0cc':i===6?'#dff4e8':i===4?'#f3e5f7':'#e6f2fc';
 const lines=labels[i].split('\n');
 out+=`<g class="component" opacity="${dim}"><rect x="${x}" y="${y}" width="125" height="69" rx="12" fill="${fill}" stroke="${current?'#e29a1c':'#4e86b2'}" stroke-width="${current?3.5:2}"/>${lines.map((line,j)=>`<text x="${x+62.5}" y="${y+39+(j-(lines.length-1)/2)*16}" text-anchor="middle" font-size="12" font-weight="650" fill="#213f59">${line}</text>`).join('')}</g>`;
});
// Five small pictograms spread evenly across the intracellular region.
// Each is an illustrative possible outcome, not an additional stage in the cascade.
const cards=[
 {x:13,lines:['Membrane permeability','or potential'],icon:`<path d="M26 13V55 M37 13V55" stroke="#d4a056" stroke-width="5" stroke-linecap="round"/><path d="M31 22V45" stroke="#2878ae" stroke-width="3" stroke-dasharray="3 3"/><path d="M18 31h27m-7-6 7 6-7 6" stroke="#2878ae" stroke-width="2" fill="none"/>`},
 {x:199,lines:['Metabolic enzyme','activity'],icon:`<path d="M15 37 Q23 10 40 24 Q53 40 34 53 Q16 58 15 37Z" fill="#b9d8f5" stroke="#347aaf" stroke-width="2"/><circle cx="28" cy="38" r="5" fill="#fff" stroke="#347aaf"/><circle cx="51" cy="22" r="6" fill="#f2c66c"/><path d="M43 26L37 31" stroke="#347aaf" stroke-width="2"/>`},
 {x:385,lines:['Cell division'],icon:`<circle cx="23" cy="33" r="16" fill="#d9e6ff" stroke="#6287bc" stroke-width="2"/><circle cx="23" cy="33" r="5" fill="#7b8bc3"/><path d="M44 33h16m-6-6 6 6-6 6" stroke="#347aaf" stroke-width="2" fill="none"/><circle cx="77" cy="24" r="11" fill="#d9e6ff" stroke="#6287bc" stroke-width="2"/><circle cx="77" cy="24" r="3" fill="#7b8bc3"/><circle cx="77" cy="45" r="11" fill="#d9e6ff" stroke="#6287bc" stroke-width="2"/><circle cx="77" cy="45" r="3" fill="#7b8bc3"/>`},
 {x:571,lines:['Cellular secretion'],icon:`<path d="M10 44H75" stroke="#d4a056" stroke-width="5" stroke-linecap="round"/><path d="M36 35 Q42 18 50 35 Q55 43 43 44 Q33 44 36 35Z" fill="#b8e4d8" stroke="#318a7d" stroke-width="2"/><path d="M44 27V11m-5 5 5-5 5 5" stroke="#318a7d" stroke-width="2" fill="none"/><circle cx="25" cy="19" r="4" fill="#6ab7a8"/><circle cx="60" cy="15" r="4" fill="#6ab7a8"/>`},
 {x:757,lines:['Gene transcription'],icon:`<path d="M24 12C53 23 20 40 53 55 M53 12C24 23 57 40 24 55" stroke="#846bb4" stroke-width="3" fill="none"/><path d="M29 17h19M30 27h17M30 39h17M29 49h19" stroke="#b8a7d6" stroke-width="2"/><path d="M61 34h17m-6-6 6 6-6 6" stroke="#846bb4" stroke-width="2" fill="none"/>`}
];
out+=`<text x="470" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#214d68">Possible cellular responses</text>`;
const outcomeOpacity=s>=6&&!b?1:.73;
cards.forEach(c=>{
 out+=`<g opacity="${outcomeOpacity}"><rect x="${c.x}" y="247" width="170" height="78" rx="9" fill="#fff" fill-opacity=".7" stroke="#b9d5e7"/><g transform="translate(${c.x+42},251) scale(.74)">${c.icon}</g><text x="${c.x+85}" y="302" font-size="10.5" font-weight="600" text-anchor="middle" fill="#254963">${c.lines[0]}</text><text x="${c.x+85}" y="315" font-size="10.5" text-anchor="middle" fill="#254963">${c.lines[1]||''}</text></g>`;
});
return out+'</svg>';
}
const cellularResponses=['Alter membrane permeability or membrane potential by opening or closing ion channels','Increase or decrease the activity of metabolic enzymes','Stimulate or inhibit target-cell division','Enhance or inhibit secretion of cellular products','Switch transcription of specific genes on or off'];
function responses(){return `<section class="responses"><h3>Possible cellular responses to hormone signalling</h3><p>Depending on the hormone and target cell, signalling can:</p><ul>${cellularResponses.map(x=>`<li>${x}</li>`).join('')}</ul><p class="hint">These are alternative possible responses; a particular hormone does not necessarily produce all five.</p></section>`}
function renderCompare(){root.innerHTML=`<h2>Compare the two signalling pathways</h2><p>Both hormone classes act only on target cells with the appropriate receptor, but the location of the receptor and the subsequent signalling events differ.</p><div class="compare"><div><h3>Amino-acid hormone (typical cAMP pathway)</h3><p><strong>Examples:</strong> Insulin, glucagon, adrenaline, antidiuretic hormone, growth hormone; thyroid hormones are amino-acid-derived exceptions to this membrane-receptor model.<br><strong>Receptor:</strong> Plasma membrane<br><strong>First event:</strong> Hormone binds surface receptor<br><strong>Intracellular events:</strong> G protein → adenylyl cyclase → cAMP → protein kinase<br><strong>Outcome:</strong> Altered activity of cellular proteins</p></div><div><h3>Steroid hormone (typical genomic pathway)</h3><p><strong>Examples:</strong> Cortisol, aldosterone, oestrogen, progesterone, testosterone.<br><strong>Receptor:</strong> Inside target cell<br><strong>First event:</strong> Hormone diffuses across membrane<br><strong>Intracellular events:</strong> Hormone–receptor complex → transcription → mRNA → protein synthesis<br><strong>Outcome:</strong> Changes in protein expression</p></div></div>`}
const questions=[{q:'Which stimulus is an example of humoral control?',a:['A rise in blood glucose stimulates pancreatic β-cells','Thyroid-stimulating hormone stimulates the thyroid gland','A sympathetic nerve impulse stimulates the adrenal medulla'],c:0,e:'Humoral control occurs when a change in blood composition directly stimulates hormone secretion.'},{q:'What makes thyroid stimulation by thyroid-stimulating hormone an example of hormonal control?',a:['Thyroid-stimulating hormone is released from a nerve terminal','One endocrine gland releases a hormone that stimulates another gland','Blood glucose directly activates thyroid cells'],c:1,e:'Thyroid-stimulating hormone is released by the anterior pituitary and stimulates the thyroid gland.'},{q:'Which event is an example of neural stimulation of hormone secretion?',a:['Low blood calcium stimulates parathyroid hormone release','Thyroid-stimulating hormone stimulates thyroid hormone release','Sympathetic impulses stimulate the adrenal medulla'],c:2,e:'Sympathetic nerves directly stimulate the adrenal medulla to secrete catecholamines.'},{q:'Where does the amino-acid hormone bind in the pathway shown?',a:['An intracellular receptor','A plasma-membrane receptor','DNA'],c:1,e:'The water-soluble hormone binds to a receptor on the cell surface.'},{q:'Which molecule is the second messenger in the pathway shown?',a:['cAMP','ATP synthase','mRNA'],c:0,e:'Adenylyl cyclase produces cAMP, which activates protein kinase A.'},{q:'What happens when the membrane receptor is unavailable?',a:['The cascade proceeds normally','The hormone enters the nucleus','The signalling cascade cannot be initiated'],c:2,e:'A functional receptor is necessary for this pathway.'},{q:'How does a steroid hormone reach its intracellular receptor?',a:['By diffusing through the lipid bilayer','Through a ligand-gated sodium channel','By being transported in a synaptic vesicle'],c:0,e:'Steroid hormones are lipid soluble and can diffuse across the membrane.'},{q:'What is a key event after the steroid hormone–receptor complex enters the nucleus?',a:['cAMP production','Regulation of gene transcription','Opening of voltage-gated calcium channels'],c:1,e:'The complex regulates transcription of target genes.'},{q:'Why does a hormone affect some cells but not others?',a:['Only target cells have the appropriate receptor','Hormones reach only one tissue through the blood','All cells respond equally'],c:0,e:'Target-cell specificity depends on the presence of appropriate receptors.'}];
function renderQuiz(){root.innerHTML=`<h2>Check your understanding</h2><p class="sub">Select one answer for each question. Feedback appears immediately.</p>${questions.map((q,i)=>`<div class="quiz-item"><p>${i+1}. ${q.q}</p>${q.a.map((v,j)=>`<button data-q="${i}" data-answer="${j}" class="${quizAnswers[i]===j?'selected':''}">${v}</button>`).join('')}${quizAnswers[i]!==undefined?`<div class="feedback ${quizAnswers[i]===q.c?'correct':'incorrect'}">${quizAnswers[i]===q.c?'Correct.':'Not quite.'} ${q.e}</div>`:''}</div>`).join('')}<div class="quiz-result">${Object.keys(quizAnswers).length===questions.length?`Score: ${questions.filter((q,i)=>quizAnswers[i]===q.c).length} / ${questions.length}`:`Answered: ${Object.keys(quizAnswers).length} / ${questions.length}`}</div>${button('Try again','clear-quiz')}`}
function changeTab(t){stop();stopSecretion();tab=t;step=0;secretionStep=0;blocked=false;render()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>changeTab(b.dataset.tab)));root.addEventListener('click',e=>{let m=e.target.closest('[data-mode]');if(m){stopSecretion();secretionMode=m.dataset.mode;secretionStep=0;render();return}let q=e.target.closest('[data-q]');if(q){quizAnswers[+q.dataset.q]=+q.dataset.answer;render();return}let b=e.target.closest('[data-act]');if(!b)return;switch(b.dataset.act){case 'sec-prev':stopSecretion();secretionStep=Math.max(0,secretionStep-1);break;case 'sec-next':stopSecretion();secretionStep=Math.min(2,secretionStep+1);break;case 'sec-reset':stopSecretion();secretionStep=0;break;case 'sec-play':if(secretionPlaying){stopSecretion()}else{secretionPlaying=true;secretionTimer=setInterval(()=>{if(secretionStep>=2){stopSecretion()}else{secretionStep++;render()}},1500)}break;case 'prev':stop();step=Math.max(0,step-1);break;case 'next':stop();step=Math.min(6,step+1);break;case 'reset':stop();step=0;blocked=false;break;case 'play':if(playing){stop()}else{playing=true;timer=setInterval(()=>{if(step>=6){stop()}else{step++;render()}},1500)}break;case 'goto-amino':changeTab('amino');return;case 'goto-steroid':changeTab('steroid');return;case 'clear-quiz':quizAnswers={};break;}render()});render();
</script></body></html>
